name: Host CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Submodules and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

